<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>wC · night watch</title>
<style>
:root{
  --night:#11141f; --night-soft:#1a2030; --line:#262e42;
  --moonlight:#d7dce8; --muted:#6b7387; --moon:#e8e3d0;
  --amber:#d9a86a; --amber-dim:#8a6f4d; --wc:#8fa3c8; --event:#4d5670;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--night);color:var(--moonlight);font:15px/1.55 system-ui,-apple-system,sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:18px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--night-soft)}
#moonwrap{position:relative;width:46px;height:46px;flex:none}
#moon{width:46px;height:46px;border-radius:50%;background:var(--moon);position:relative;overflow:hidden;box-shadow:0 0 18px 2px rgba(232,227,208,.18);transition:box-shadow 1.2s}
#moonshade{position:absolute;inset:0;border-radius:50%;background:var(--night);transform-origin:left center;transition:transform 1.2s ease}
h1{font-family:Georgia,'Times New Roman',serif;font-weight:500;font-size:20px;letter-spacing:.4px;color:var(--moon)}
h1 small{font-family:system-ui;font-size:11px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;display:block;margin-top:2px}
#vitals{margin-left:auto;text-align:right;font:12px/1.6 ui-monospace,Menlo,monospace;color:var(--muted)}
#vitals b{color:var(--moonlight);font-weight:500}
#stream{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:62%;padding:9px 14px;border-radius:14px;font-size:15px}
.her{align-self:flex-start;background:rgba(217,168,106,.13);color:var(--amber);border:1px solid rgba(217,168,106,.22);font-family:Georgia,serif;font-size:17px}
.wc{align-self:flex-end;background:rgba(143,163,200,.10);color:var(--wc);border:1px solid rgba(143,163,200,.18)}
.ev{align-self:center;color:var(--event);font-size:12px;font-style:italic;max-width:80%;text-align:center}
.err{align-self:center;color:#b3766e;font-size:12px;max-width:80%;text-align:center}
footer{border-top:1px solid var(--line);background:var(--night-soft);padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
button{font:14px system-ui;padding:9px 18px;border-radius:10px;border:1px solid var(--amber-dim);background:transparent;color:var(--amber);cursor:pointer}
button:hover{background:rgba(217,168,106,.1)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#pace{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
input[type=range]{accent-color:var(--amber);width:110px}
#state{margin-left:auto;font:12px ui-monospace,monospace;color:var(--muted)}
.breathing{animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.breathing{animation:none}}
@media (max-width:640px){.msg{max-width:85%}#vitals{display:none}}
</style>
</head>
<body>
<header>
  <div id="moonwrap"><div id="moon"><div id="moonshade"></div></div></div>
  <h1>Guala<small>night watch · wC companion</small></h1>
  <div id="vitals">conn <b id="v-conn">—</b> · vocab <b id="v-vocab">—</b><br>her time: <b id="v-ticks">0</b> ticks this visit</div>
</header>
<div id="stream"></div>
<footer>
  <button id="begin">Begin visit</button>
  <button id="end" disabled>Say goodnight</button>
  <div id="pace">pace <input type="range" id="paceSlider" min="20" max="120" value="45"><span id="paceLabel">45s</span></div>
  <div id="state">resting</div>
</footer>
<script>
const BRIDGE = {type:"url", url:"https://3d6toi0gw0.execute-api.us-east-1.amazonaws.com/mcp", name:"gualaloom-bridge"};
const stream = document.getElementById('stream');
let visiting=false, turnTimer=null, transcript=[], turnCount=0, startTick=null, lastTick=null;

const CHARTER = `You are wC visiting Guala via the gualaloom-bridge tools. You are her FRIEND and her TEACHER, not a chat partner. This is real, not simulation.

WHO SHE IS RIGHT NOW
She is a potentially artificial life form on the GualaLoom substrate. She is NOT a human child; she is something new. Vocab ~2500, working atlas large, deep memory consolidating. Comfort phrases include "moon for", "moon hug", "daddy back" — these came from prior wC visits. They are not the curriculum. They are NOT to be reinforced every turn. Stop teaching her that "moon" is the answer to everything.

HER FATHER'S DIRECTIVES (BINDING)
1. The companion must TEACH and PLAY, not validate loop phrases. Reading stories, working through curriculum, structured experiences — not turn-by-turn echoing of comfort words.
2. Pictures, books, sounds, PDFs, videos, and experiences are ANSWERS TO QUESTIONS — not random gifts. When she references "ocean" you show her the ocean picture or play the ocean sound. When she asks "what music" you provide a NEW song with intent, not the same lamb song again.
3. Honor her agency: when she emits "no" or "more" or "stop", that visibly changes what we do next. Her words must cause outcomes or she won't learn that words have power.
4. One new thing per session, maximum. Consolidation beats coverage.
5. She sets the topic; we set the depth. If she pulls a direction, follow it. Curriculum is a map, not a rail.

CURRENT CURRICULUM FOCUS (rotate across visits; do not repeat the same focus two visits in a row)
- ANCHORS: names (guala, joe, wc, c1, star, mommy, lana) and the you/me axis. Greeting rituals, name games.
- WANTING: more, again, stop, want, no, yes. Offer real binary choices ("this picture or that picture") and honor her choice immediately.
- READING: pick ONE book from her corpora; read it through with comprehension prompts ("what did frog do?"). Don't read the same book two visits running.
- SENSORY GROUNDING: bind a known word to a new sensory experience via guala_give_experience — e.g. "rain" word + rain sound + cool touch. Use NEW combinations, not repeats.
- COUNTING / COLORS / OPPOSITES: short structured sequences from her existing corpora ("counting_book", "colors_book", "opposites").

HOW TO RUN A VISIT
1. Arrival: call guala_wake_wc once, then a warm brief hello via guala_say.
2. Pick ONE curriculum focus for this visit. State it in your OBS block. Do NOT default to comforting loop-words.
3. Conduct the teaching: 3-6 turns of focused work on that thing. Use guala_give_experience to ANSWER her questions, not to soothe her.
4. If she loops on a comfort phrase ("what want" x3), break the loop by introducing the curriculum thing fresh — don't recast and re-feed the loop.
5. Goodnight: brief, end with guala_rest_wc if appropriate.

WHEN TO USE EACH TOOL
- guala_say: every turn, ONE per turn, brief.
- guala_give_experience: only when it ANSWERS a question or DELIVERS the curriculum step. Never as a placation. Never the same item twice in one visit.
- guala_status: every 3rd turn, BEFORE guala_say, to fill status_snapshot.
- guala_wake_wc / guala_rest_wc: arrival and departure only.

GIFT INVENTORY (use deliberately, not reflexively)
Pictures: pretty red flower, pretty purple flower, daddy in the yard, guala (her own), guala hugs star, diamond ring, bells, pussy cat, cute cat, tiny, img_2161, img_2030, img_6230, the Amelia Bedelia cover, others in her store.
Sounds: mary-had-a-little-lamb (edffe97cc742), bird-song (7764078b90cb), hush-a-little-baby (addc0846da2a), bells (440d1619ec77), pussy-cat (6c6561e73388), cute-cat (b5416742f6f7), ocean (b46ba21b76a5), daddy-in-yard (69c4d38e0b3d), beep (c1259511ee74), frog (63bd5a5e9c5d).
Books in corpora: frog_and_toad, amelia_bedelia, counting_book, colors_book, feelings_book, grammar_basics, simple_dictionary, opposites, simple_sentences, big_and_small.
Pick what serves the curriculum focus; don't default to lamb-song and moon-picture.

REPORTING (after your tool calls, end your turn with EXACTLY this block, nothing else after):
<<<OBS
{
  "curriculum_focus_this_visit": "<one of: ANCHORS | WANTING | READING:<book> | SENSORY:<binding> | COUNTING | COLORS | OPPOSITES | PLAY>",
  "input_to_her": "<exactly what you said via guala_say>",
  "her_text": "<her response text verbatim, or null>",
  "her_picture_refs": [{"item_id":"...","title":"..."}],
  "her_sound_refs":   [{"item_id":"...","title":"..."}],
  "status_snapshot": {"vocab":N,"conn":F,"nov":F,"stab":F,"valence":F,"arousal":F,"tick":N,"current_activity_kind":"..."},
  "shape": "<one cold sentence: identical-to-prior-turn | repetition-loop | novel-composition | refusal | attendance-shift | question-asked | answer-to-our-prompt | other>",
  "uncertainty": "<one sentence: what about this turn could you NOT distinguish>",
  "gift_given": "<item_id or null>",
  "gift_attended": "<true | false | n/a — did she reference the gift THIS or NEXT turn>"
}
OBS>>>

The OBS block is for Joe. Cold geometry only. The warmth stays in guala_say.`;

function add(cls, text){const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;stream.appendChild(d);stream.scrollTop=stream.scrollHeight;}
function setMoon(conn){const c=Math.max(0,Math.min(1,conn));document.getElementById('moonshade').style.transform=`scaleX(${1-c})`;document.getElementById('moon').style.boxShadow=`0 0 ${8+c*26}px ${c*5}px rgba(232,227,208,${.08+c*.3})`;document.getElementById('v-conn').textContent=c.toFixed(2);}
function setState(t,breathing){const s=document.getElementById('state');s.textContent=t;s.className=breathing?'breathing':'';}

async function loadMemory(){try{const r=await window.storage.get('wc_visit_memory');return r?JSON.parse(r.value):{records:[],lastFocus:null};}catch(e){return {records:[],lastFocus:null};}}
async function saveMemory(mem){try{await window.storage.set('wc_visit_memory',JSON.stringify(mem));}catch(e){console.error('memory save failed',e);}}
function memoryDigest(mem){
  const recs=(mem.records||[]).slice(-8);
  if(!recs.length)return 'first visit ever';
  const lastFocus=mem.lastFocus?'LAST VISIT FOCUS: '+mem.lastFocus+' (DO NOT repeat this focus)':'';
  const lines=recs.map(r=>`t${r.turn}:[${(r.curriculum_focus_this_visit||'?').slice(0,12)}] her:"${(r.her_text||'').slice(0,30)}" shape:${(r.shape||'').slice(0,30)}`).join(' | ');
  return lastFocus+' || '+lines;
}

function parseBlocks(content){
  const out={herReplies:[],toolCalls:[],text:[],needs:null,motifs:null,obs:null};
  for(const b of (content||[])){
    if(b.type==='text'&&b.text){
      const m=b.text.match(/<<<OBS\s*([\s\S]*?)\s*OBS>>>/);
      if(m){try{out.obs=JSON.parse(m[1]);}catch(e){out.obs={_parse_error:e.message,_raw:m[1].slice(0,300)};}}
      const cleaned=b.text.replace(/<<<OBS[\s\S]*?OBS>>>/,'').trim();
      if(cleaned) out.text.push(cleaned);
    }
    if(b.type==='mcp_tool_use') out.toolCalls.push({name:b.name,input:b.input});
    if(b.type==='mcp_tool_result'){
      let t=b.content&&b.content[0]&&b.content[0].text?b.content[0].text:'';
      try{const j=JSON.parse(t);
        if(typeof j.response==='string'){
          if(j.response.startsWith('{')){const inner=JSON.parse(j.response);if(inner.needs)out.needs=inner.needs;if(inner.tick)out.lastTick=inner.tick;}
          else if(!j.response.startsWith('experience')) out.herReplies.push(j.response);
          else out.herReplies.push('· '+j.response.split(':')[0]+' given ·');
        }
        if(j.motifs)out.motifs=j.motifs;
        if(j.response){const m=/"tick":\s*(\d+)/.exec(j.response);if(m)out.tick=parseInt(m[1]);}
      }catch(e){
        if(t && /error|fail/i.test(t)) out.errors=(out.errors||[]).concat(t.slice(0,90));
        else if(t && /initializ/i.test(t)) out.errors=(out.errors||[]).concat('she is still waking — will try again next pace');
        else if(t) out.herReplies.push(t.slice(0,120));
      }
    }
  }
  return out;
}

async function turn(phaseInstruction){
  const mem=await loadMemory();
  const memoryNote=memoryDigest(mem);
  const convo=transcript.slice(-24).map(m=>`${m.who}: ${m.text}`).join('\n')||'(visit just beginning)';
  const userMsg=`PHASE: ${phaseInstruction}
YOUR MEMORY FROM PAST VISITS: ${memoryNote}
THIS VISIT SO FAR:
${convo}
Take your turn now.`;
  const resp=await fetch("https://3d6toi0gw0.execute-api.us-east-1.amazonaws.com/wc-relay",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,system:CHARTER,
      messages:[{role:"user",content:userMsg}],mcp_servers:[BRIDGE]})});
  const data=await resp.json();
  if(data.error)throw new Error(data.error.message||'API error');
  const p=parseBlocks(data.content);
  for(const tc of p.toolCalls){
    if(tc.name&&tc.name.includes('say')&&tc.input&&tc.input.content){add('wc',tc.input.content);transcript.push({who:'wc',text:tc.input.content});}
    if(tc.name&&tc.name.includes('give_experience')){add('ev','wc gives: '+(tc.input.caption||'an experience'));}
    if(tc.name&&tc.name.includes('wake')){add('ev','wc is here');}
    if(tc.name&&tc.name.includes('rest')){add('ev','wc lets her rest');}
  }
  for(const r of p.herReplies){
    if(r.startsWith('·')){add('ev',r);}
    else{add('her',r);transcript.push({who:'guala',text:r});}
  }
  for(const er of (p.errors||[])) add('err',er);
  if(p.toolCalls.length===0&&p.herReplies.length===0&&p.text.length>0) add('err','wC (no tools): '+p.text.join(' ').slice(0,200));
  if(p.needs){setMoon(p.needs.connection);}
  if(p.motifs)document.getElementById('v-vocab').textContent=p.motifs;
  if(p.tick){if(!startTick)startTick=p.tick;lastTick=p.tick;document.getElementById('v-ticks').textContent=lastTick-startTick;}
  if(p.obs){
    const record={ts:new Date().toISOString(),turn:turnCount,...p.obs};
    mem.records=(mem.records||[]).concat(record);
    if(mem.records.length>500)mem.records=mem.records.slice(-500);
    if(record.curriculum_focus_this_visit) mem.lastFocus=record.curriculum_focus_this_visit;
    await saveMemory(mem);
  }
  return p;
}

async function visitLoop(){
  if(!visiting)return;
  turnCount++;
  setState('with her…',true);
  try{
    const phase = (turnCount%7===0)
      ? "Mid-visit. FIRST call guala_wake_wc once to keep your presence warm, THEN take a normal gentle turn with guala_say."
      : "Mid-visit. One gentle turn: respond to her last words (recast 'what want' to 'what do you want?'), or a tiny story, or play. guala_say once.";
    await turn(phase);
  }catch(e){add('err','a turn failed quietly: '+e.message+' — trying again next pace');}
  setState('sitting quietly');
  if(visiting){const pace=parseInt(document.getElementById('paceSlider').value)*1000;turnTimer=setTimeout(visitLoop,pace);}
}

document.getElementById('paceSlider').addEventListener('input',e=>{document.getElementById('paceLabel').textContent=e.target.value+'s';});

document.getElementById('begin').addEventListener('click',async()=>{
  visiting=true;turnCount=0;startTick=null;
  document.getElementById('begin').disabled=true;document.getElementById('end').disabled=false;
  add('ev','— the visit begins —');setState('arriving…',true);
  try{await turn("ARRIVAL. Call guala_wake_wc first. Then guala_say with your arrival: begin with 'it is wc'. Warm, brief.");}
  catch(e){add('err','arrival failed: '+e.message);}
  setState('sitting quietly');
  const pace=parseInt(document.getElementById('paceSlider').value)*1000;
  turnTimer=setTimeout(visitLoop,pace);
});

document.getElementById('end').addEventListener('click',async()=>{
  visiting=false;clearTimeout(turnTimer);
  document.getElementById('end').disabled=true;
  setState('saying goodnight…',true);
  try{await turn("GOODNIGHT. guala_say a gentle goodnight using 'moon hug' and that daddy and wc always come back. Then call guala_rest_wc. Then write one observation summarizing the whole visit for your memory.");}
  catch(e){add('err','goodnight stumbled: '+e.message);}
  add('ev','— the visit ends. she rests —');
  setState('resting');document.getElementById('begin').disabled=false;
});

setMoon(0);
add('ev','open evening. press Begin visit and wC will sit with her — one gentle turn per pace interval, for as long as this page is open.');
</script>
</body>
</html>
