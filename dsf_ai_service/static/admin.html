<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSF-AI Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #111; color: #eee; }
    .login-gate { display: flex; justify-content: center; align-items: center; height: 100vh; }
    .login-box { background: #1a1a1a; padding: 2rem; border-radius: 8px; text-align: center; }
    .login-box h2 { margin-bottom: 1rem; }
    .login-box input { padding: 0.5rem; border: 1px solid #333; border-radius: 4px; background: #222; color: #eee; font-size: 1rem; width: 200px; }
    .login-box button { padding: 0.5rem 1.5rem; background: #2563eb; color: #fff; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; margin-left: 0.5rem; }
    .admin-page { display: none; max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    .admin-header h1 { font-size: 1.5rem; }
    .admin-header span { color: #666; font-size: 0.85rem; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 1.25rem; }
    .stat-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: #666; margin-bottom: 0.3rem; }
    .stat-value { font-size: 2rem; font-weight: 700; color: #2563eb; }
    .stat-sub { font-size: 0.8rem; color: #666; margin-top: 0.2rem; }
    .section { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 1.25rem; margin-bottom: 1.5rem; }
    .section h3 { margin-bottom: 1rem; font-size: 1rem; color: #aaa; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { text-align: left; padding: 0.5rem; border-bottom: 1px solid #333; color: #666; font-size: 0.75rem; text-transform: uppercase; }
    td { padding: 0.5rem; border-bottom: 1px solid #222; }
    tr:hover { background: #222; }
    .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 10px; font-size: 0.7rem; font-weight: 600; }
    .badge-free { background: #1e3a2f; color: #4ade80; }
    .badge-paid { background: #1e2a4a; color: #60a5fa; }
    .badge-sub { background: #3a1e4a; color: #c084fc; }
    .refresh-btn { padding: 0.4rem 1rem; background: #333; color: #eee; border: 1px solid #555; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
    .refresh-btn:hover { background: #444; }
    .loading { color: #666; padding: 1rem; text-align: center; }
  </style>
</head>
<body>

<div class="login-gate" id="login-gate">
  <div class="login-box">
    <h2>DSF-AI Admin</h2>
    <input type="password" id="admin-pass" placeholder="Admin password">
    <button onclick="tryLogin()">Enter</button>
  </div>
</div>

<div class="admin-page" id="admin-page">
  <div class="admin-header">
    <h1>DSF-AI Admin Dashboard</h1>
    <span id="last-refresh"></span>
    <button class="refresh-btn" onclick="loadAll()">Refresh</button>
  </div>

  <div class="stat-grid">
    <div class="stat-card">
      <div class="stat-label">Total Users</div>
      <div class="stat-value" id="stat-users">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total Analyses</div>
      <div class="stat-value" id="stat-analyses">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Credits Purchased</div>
      <div class="stat-value" id="stat-credits">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Active Subscribers</div>
      <div class="stat-value" id="stat-subs">—</div>
    </div>
  </div>

  <div class="section">
    <h3>User Activity</h3>
    <table>
      <thead>
        <tr>
          <th>User ID</th>
          <th>Analyses</th>
          <th>Credits</th>
          <th>Remaining</th>
          <th>Tier</th>
          <th>Last Analysis</th>
          <th>Last Payment</th>
        </tr>
      </thead>
      <tbody id="user-tbody">
        <tr><td colspan="7" class="loading">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="section">
    <h3>System Health</h3>
    <table>
      <thead>
        <tr><th>Service</th><th>Status</th><th>Details</th></tr>
      </thead>
      <tbody id="health-tbody">
        <tr><td colspan="3" class="loading">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const API = 'https://3d6toi0gw0.execute-api.us-east-1.amazonaws.com';
const ADMIN_HASH = '12306cec6b0edaae6de469ce6db4a9eaacab207d4f708742d66c93eeea631713';

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function tryLogin() {
  const pass = document.getElementById('admin-pass').value;
  const hash = await sha256(pass);
  if (hash === ADMIN_HASH) {
    document.getElementById('login-gate').style.display = 'none';
    document.getElementById('admin-page').style.display = 'block';
    sessionStorage.setItem('dsf_admin', '1');
    loadAll();
  } else {
    alert('Wrong password');
  }
}

// Auto-login if session exists
if (sessionStorage.getItem('dsf_admin')) {
  document.getElementById('login-gate').style.display = 'none';
  document.getElementById('admin-page').style.display = 'block';
  document.addEventListener('DOMContentLoaded', loadAll);
}

document.getElementById('admin-pass').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') tryLogin();
});

async function loadAll() {
  document.getElementById('last-refresh').textContent = 'Refreshing...';

  // Load usage data from admin endpoint
  try {
    const resp = await fetch(`${API}/api/v1/admin/usage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ admin_key: 'dsf-ai-admin-2026' }),
    });
    const data = await resp.json();

    if (data.users) {
      // Stats
      const users = data.users;
      let totalAnalyses = 0;
      let totalCredits = 0;
      let subs = 0;

      users.forEach(u => {
        totalAnalyses += u.analysis_count || 0;
        totalCredits += u.credits || 0;
        if (u.tier === 'academic' || u.tier === 'industry') subs++;
      });

      document.getElementById('stat-users').textContent = users.length;
      document.getElementById('stat-analyses').textContent = totalAnalyses;
      document.getElementById('stat-credits').textContent = totalCredits;
      document.getElementById('stat-subs').textContent = subs;

      // User table
      const tbody = document.getElementById('user-tbody');
      tbody.innerHTML = users.sort((a, b) => (b.analysis_count || 0) - (a.analysis_count || 0)).map(u => {
        const remaining = Math.max(0, (1 + (u.credits || 0)) - (u.analysis_count || 0));
        const tier = u.tier || 'free';
        const badgeClass = tier === 'free' ? 'badge-free' : (tier === 'per_analysis' ? 'badge-paid' : 'badge-sub');
        const lastAnalysis = u.last_analysis ? new Date(u.last_analysis * 1000).toLocaleString() : '—';
        const lastPayment = u.last_payment ? new Date(u.last_payment * 1000).toLocaleString() : '—';
        return `<tr>
          <td style="font-family:monospace;font-size:0.75rem;">${u.user_id.substring(0, 20)}...</td>
          <td>${u.analysis_count || 0}</td>
          <td>${u.credits || 0}</td>
          <td>${remaining}</td>
          <td><span class="badge ${badgeClass}">${tier}</span></td>
          <td>${lastAnalysis}</td>
          <td>${lastPayment}</td>
        </tr>`;
      }).join('');
    }
  } catch (e) {
    document.getElementById('user-tbody').innerHTML = `<tr><td colspan="7">Error loading: ${e.message}</td></tr>`;
  }

  // Health checks
  try {
    const checks = [
      { name: 'API Gateway', url: `${API}/health` },
      { name: 'ECS (CSV Analysis)', url: `${API}/api/v1/cluster`, method: 'POST', body: JSON.stringify({ element: 'Au', N_atoms: 13 }) },
    ];

    const healthTbody = document.getElementById('health-tbody');
    let healthHtml = '';

    for (const check of checks) {
      try {
        const opts = { method: check.method || 'GET' };
        if (check.body) {
          opts.headers = { 'Content-Type': 'application/json' };
          opts.body = check.body;
        }
        const t0 = performance.now();
        const resp = await fetch(check.url, opts);
        const ms = Math.round(performance.now() - t0);
        const ok = resp.ok;
        healthHtml += `<tr>
          <td>${check.name}</td>
          <td style="color:${ok ? '#4ade80' : '#f87171'}">${ok ? 'OK' : 'ERROR ' + resp.status}</td>
          <td>${ms}ms</td>
        </tr>`;
      } catch (e) {
        healthHtml += `<tr><td>${check.name}</td><td style="color:#f87171">DOWN</td><td>${e.message}</td></tr>`;
      }
    }
    healthTbody.innerHTML = healthHtml;
  } catch (e) {
    // ignore
  }

  document.getElementById('last-refresh').textContent = `Last refresh: ${new Date().toLocaleTimeString()}`;
}
</script>
</body>
</html>
