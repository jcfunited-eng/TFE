<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Guala</title>
<style>
:root{--bg:#0d1117;--bg-alt:#161b22;--text:#e6edf3;--text-muted:#7d8590;--accent:#58a6ff;--border:#30363d;--input-bg:#0d1117;--msg-user:#1f2937;--msg-sub:#161b22;--ev-activity:#58a6ff;--ev-motif:#3fb950;--ev-emission:#f0883e;--nmda-fire:#3fb950;--nmda-block:#f85149}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'SF Mono','Fira Code',monospace;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
#perm-strip{display:flex;gap:6px;padding:6px 14px;background:#0b0e14;border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center}
.perm-btn{background:none;border:1px solid var(--border);color:var(--text-muted);padding:4px 10px;border-radius:4px;font-family:inherit;font-size:10px;cursor:pointer;white-space:nowrap}
.perm-btn:hover{border-color:var(--accent);color:var(--text)}
.perm-btn.granted{border-color:var(--ev-motif);color:var(--ev-motif)}
.perm-btn.denied{border-color:var(--nmda-block);color:var(--nmda-block)}
#speaker-badge{font-size:10px;color:var(--text-muted);cursor:pointer;margin-left:auto;display:flex;align-items:center;gap:6px}
#mute-toggle{background:none;border:1px solid var(--border);color:var(--text-muted);padding:2px 8px;border-radius:4px;font-family:inherit;font-size:9px;cursor:pointer}
header{padding:8px 14px;border-bottom:1px solid var(--border);background:var(--bg-alt);display:flex;justify-content:space-between;align-items:center}
.header-left h1{font-size:15px;font-weight:600;color:var(--accent)}
.header-left .subtitle{font-size:9px;color:var(--text-muted)}
.header-right{display:flex;align-items:center;gap:6px}
.hdr-btn{background:none;border:1px solid var(--border);color:var(--text-muted);padding:3px 8px;border-radius:4px;font-family:inherit;font-size:9px;cursor:pointer}
.hdr-btn:hover{border-color:var(--accent);color:var(--text)}
#stats-line{padding:4px 14px;font-size:9px;color:var(--text-muted);background:var(--bg-alt);border-bottom:1px solid var(--border)}
#main-area{flex:1;display:flex;overflow:hidden}
#convo-col{flex:1;display:flex;flex-direction:column;min-width:0}
#transcript{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:5px}
.msg{max-width:85%;padding:6px 10px;border-radius:6px;font-size:11px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--msg-user);border:1px solid var(--border)}
.msg.substrate{align-self:flex-start;background:var(--msg-sub);border:1px solid var(--border);color:var(--accent)}
.msg.emission{align-self:flex-start;background:transparent;border:1px solid #30363d44;color:var(--ev-emission);font-style:italic;font-size:10px}
.msg.system{align-self:center;color:var(--text-muted);font-size:9px;font-style:italic}
.response-block{align-self:flex-start;max-width:90%}
.response-text{padding:6px 10px;border-radius:6px 6px 0 0;background:var(--msg-sub);border:1px solid var(--border);color:var(--accent);font-size:11px;line-height:1.45}
.response-text .tok-anno{color:var(--text-muted);font-size:9px}
.response-meta{display:flex;align-items:center;gap:6px;padding:3px 10px;background:var(--bg);border:1px solid var(--border);border-top:none;border-radius:0 0 6px 6px;font-size:9px;color:var(--text-muted)}
.fb-btn{cursor:pointer;font-size:13px;opacity:0.4}.fb-btn:hover{opacity:1}.fb-btn.active{opacity:1}
#upload-bar{display:flex;gap:4px;padding:4px 14px;background:var(--bg-alt);border-top:1px solid var(--border);align-items:center;flex-wrap:wrap}
.upload-btn{background:none;border:1px solid var(--border);color:var(--text-muted);padding:3px 8px;border-radius:4px;font-family:inherit;font-size:10px;cursor:pointer}
.upload-btn:hover{border-color:var(--accent);color:var(--text)}
#cam-preview{display:none;width:80px;height:60px;border-radius:4px;border:1px solid var(--border);object-fit:cover;position:fixed;bottom:60px;right:10px;z-index:50;opacity:0.8}
#input-row{padding:8px 14px;border-top:1px solid var(--border);background:var(--bg-alt);display:flex;gap:6px;align-items:center}
#input-row input{flex:1;background:var(--input-bg);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-family:inherit;font-size:11px;outline:none}
#input-row input:focus{border-color:var(--accent)}
#input-row button{background:var(--accent);color:#0d1117;border:none;padding:6px 14px;border-radius:6px;font-family:inherit;font-size:11px;font-weight:600;cursor:pointer}
#mic-btn,#snap-btn{display:none;background:none;border:1px solid var(--border);color:var(--text-muted);padding:6px 10px;border-radius:6px;font-family:inherit;font-size:11px;cursor:pointer}
#mic-btn:hover,#snap-btn:hover{border-color:var(--accent);color:var(--text)}
#mic-btn.recording{border-color:var(--nmda-block);color:var(--nmda-block);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
#live-transcript{font-size:11px;color:var(--ev-emission);padding:2px 14px;min-height:16px;overflow:hidden;font-style:italic}
#state-panel{width:280px;border-left:1px solid var(--border);background:var(--bg-alt);overflow-y:auto;padding:8px;font-size:9px}
.ps{margin-bottom:8px}
.ps-title{font-size:9px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;padding-bottom:2px;border-bottom:1px solid var(--border)}
.ps-row{display:flex;justify-content:space-between;padding:1px 0}
.ps-row .l{color:var(--text-muted)}.ps-row .v{color:var(--text)}
.nmda-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:3px}
.nmda-dot.fired{background:var(--nmda-fire)}.nmda-dot.blocked{background:var(--nmda-block)}.nmda-dot.idle{background:var(--border)}
.ev{padding:2px 6px;font-size:8px;color:var(--text-muted);border-bottom:1px solid #21262d}
/* Bundle modal */
#bundle-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:100;justify-content:center;align-items:center}
#bundle-modal.visible{display:flex}
#bundle-form{background:var(--bg-alt);border:1px solid var(--border);border-radius:8px;padding:16px;width:380px;max-height:80vh;overflow-y:auto}
#bundle-form h3{font-size:12px;color:var(--accent);margin-bottom:10px}
#bundle-form label{display:block;font-size:9px;color:var(--text-muted);margin:8px 0 3px}
#bundle-form input[type="text"],#bundle-form input[type="file"]{width:100%;background:var(--input-bg);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:4px;font-family:inherit;font-size:10px}
#bundle-form select{width:100%;background:var(--input-bg);border:1px solid var(--border);color:var(--text);padding:4px;border-radius:4px;font-family:inherit;font-size:9px}
.bundle-btns{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
.bundle-btns button{padding:5px 14px;border-radius:4px;font-family:inherit;font-size:10px;cursor:pointer;border:1px solid var(--border)}
.bundle-btns .cancel{background:none;color:var(--text-muted)}
.bundle-btns .submit{background:var(--accent);color:#0d1117;border:none;font-weight:600}
@media(max-width:700px){#state-panel{display:none}.msg{max-width:95%}}
</style>
</head>
<body>
<!-- Permission Strip -->
<div id="perm-strip">
  <button class="perm-btn" id="mic-perm" onclick="requestMic()">Enable Microphone</button>
  <span id="mic-status" style="font-size:11px;color:var(--text-muted);margin-left:4px"></span>
  <button class="perm-btn" id="cam-perm" onclick="requestCam()">Enable Camera</button>
  <span id="speaker-badge" onclick="unlockAudio()">&#x1f507; Click anywhere to enable audio</span>
  <button id="mute-toggle" onclick="toggleMute()">unmuted</button>
</div>
<header>
  <div class="header-left">
    <h1>Guala</h1>
    <div class="subtitle" id="session-line">session: ---</div>
  </div>
  <div class="header-right">
    <button class="hdr-btn" onclick="newSession()">new session</button>
  </div>
</header>
<div id="stats-line">she is still loading...</div>
<div id="activity-line" style="padding:2px 14px;font-size:9px;color:var(--ev-activity);background:var(--bg-alt);border-bottom:1px solid var(--border)"></div>
<div id="needs-line" style="padding:2px 14px;font-size:8px;color:var(--text-muted);background:var(--bg-alt);border-bottom:1px solid var(--border)"></div>
<audio id="voice" style="display:none"></audio>
<div id="main-area">
<div id="convo-col">
  <div id="transcript"></div>
  <div id="live-transcript">&nbsp;</div>
  <div id="upload-bar">
    <button class="upload-btn" onclick="uploadBook()">&#x1f4d6; book</button>
    <button class="upload-btn" onclick="uploadPDF()">&#x1f4d5; PDF</button>
    <button class="upload-btn" onclick="uploadPicture()">&#x1f5bc; picture</button>
    <button class="upload-btn" onclick="uploadSound()">&#x1f50a; sound</button>
    <button class="upload-btn" onclick="uploadVideo()">&#x1f3a5; video</button>
    <button class="upload-btn" onclick="openBundleModal()">&#x1f381; experience</button>
    <button class="upload-btn" onclick="triggerSleep()">&#x1f4a4; sleep</button>
    <button class="upload-btn" id="snap-btn" style="display:none" onclick="takeSnapshot()">&#x1f4f8; snapshot</button>
  </div>
  <video id="cam-preview" autoplay playsinline muted></video>
  <div id="input-row">
    <input id="msg" type="text" placeholder="say something..." autocomplete="off">
    <button id="mic-btn" style="display:none;padding:6px 14px;font-size:12px" onclick="toggleSTT()">&#x1f399; mic off</button>
    <button id="brain-toggle" onclick="toggleBrainMode()" style="background:none;border:1px solid var(--border);color:var(--text-muted);padding:6px 10px;border-radius:6px;font-family:inherit;font-size:10px;cursor:pointer" title="Toggle between v5 engine and organ-brain direct">🧠 engine</button>
    <button onclick="sendMsg()">send</button>
  </div>
</div>
<div id="state-panel">
  <div class="ps"><div class="ps-title">Substrate</div><div id="sp-substrate">--</div></div>
  <div class="ps"><div class="ps-title">Hemispheres</div><div id="sp-hemispheres">--</div></div>
  <div class="ps"><div class="ps-title">Persistence</div><div id="sp-persistence">--</div></div>
  <div class="ps"><div class="ps-title">Recent Emissions</div><div id="sp-emissions" style="max-height:150px;overflow-y:auto">--</div></div>
  <div class="ps"><div class="ps-title">Pool Activity</div><div id="sp-pools">--</div></div>
  <div class="ps"><div class="ps-title">NMDA Gates</div><div id="sp-nmda">--</div></div>
  <div class="ps"><div class="ps-title">Events</div><div id="sp-events" style="max-height:120px;overflow-y:auto"></div></div>
</div>
</div>

<!-- Experience Bundle Modal -->
<div id="bundle-modal">
<div id="bundle-form">
  <h3>Give her an experience</h3>
  <label>Caption</label>
  <input type="text" id="bundle-caption" placeholder="what is this experience?">
  <label>Picture</label>
  <input type="file" id="bundle-image" accept="image/*">
  <label>Sound</label>
  <input type="file" id="bundle-sound" accept="audio/*">
  <label>Video</label>
  <input type="file" id="bundle-video" accept="video/*">
  <label>Touch (ctrl/cmd-click for multiple)</label>
  <select id="bundle-touch" multiple size="3">
    <option>warm</option><option>cool</option><option>cold</option><option>hot</option>
    <option>soft</option><option>hard</option><option>smooth</option><option>rough</option>
    <option>wet</option><option>dry</option><option>sharp</option><option>fuzzy</option>
    <option>heavy</option><option>light</option><option>squishy</option><option>bumpy</option>
  </select>
  <label>Smell</label>
  <select id="bundle-smell" multiple size="3">
    <option>fresh</option><option>floral</option><option>sweet</option><option>earthy</option>
    <option>smoky</option><option>salty</option><option>fruity</option><option>woody</option>
    <option>clean</option><option>rain</option><option>grass</option><option>ocean</option>
  </select>
  <label>Taste</label>
  <select id="bundle-taste" multiple size="3">
    <option>sweet</option><option>sour</option><option>salty</option><option>bitter</option>
    <option>savory</option><option>spicy</option><option>creamy</option><option>tangy</option>
  </select>
  <div class="bundle-btns">
    <button class="cancel" onclick="closeBundleModal()">cancel</button>
    <button class="submit" onclick="submitBundle()">give her this</button>
  </div>
</div>
</div>

<script>
const API='https://3d6toi0gw0.execute-api.us-east-1.amazonaws.com';
const transcript=document.getElementById('transcript');
const msgInput=document.getElementById('msg');
const voiceEl=document.getElementById('voice');
const liveT=document.getElementById('live-transcript');
const evDiv=document.getElementById('sp-events');
const statsLine=document.getElementById('stats-line');

let sid=localStorage.getItem('guala_session_id');
if(!sid){sid='sid_'+Math.random().toString(36).slice(2,10);localStorage.setItem('guala_session_id',sid)}
document.getElementById('session-line').textContent='session: '+sid;

let lastTick=0,audioUnlocked=false,muted=false,micGranted=false,camStream=null,sttActive=false,recognition=null;
let last503msg=0; // debounce 503 messages

// --- 503/500 handling ---
function handleNotReady(context){
  const now=Date.now();
  if(now-last503msg<60000)return; // at most once per minute
  last503msg=now;
  addMsg('she is still loading \u2014 give her a moment','system');
}

// --- Sleep / Dream (5b) ---
async function triggerSleep(){
  addMsg('(asking her to dream...)','system');
  try{
    const r=await fetchT(`${API}/v7/quiet`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid,n_ticks:50})},15000);
    if(r.status===503||r.status===500){handleNotReady('sleep');return}
    const d=await r.json();
    addMsg('(she is dreaming \u2014 '+d.replayed+' replayed memories, '+d.commits+' commits)','system');
    pollV7State();
  }catch(e){addMsg('sleep error: '+e.message,'system')}
}

// --- Permission Strip (5a: toggle off support) ---
// GL-BRIEF-SENSORY-IO Part D: mic audio streaming to sound krimelack
let micStream=null,micRecorder=null;
function startMicSoundStream(stream){
  if(micRecorder)return;
  try{micRecorder=new MediaRecorder(stream,{mimeType:'audio/webm'})}
  catch(e){try{micRecorder=new MediaRecorder(stream)}catch(e2){return}}
  micRecorder.ondataavailable=async(e)=>{
    if(e.data.size<100)return;
    const reader=new FileReader();
    reader.onload=async()=>{
      const b64=reader.result.split(',')[1];
      fetchT(`${API}/sound_frame`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:b64,command:'',source:'joe_voice'})},8000).catch(()=>{});
    };
    reader.readAsDataURL(e.data);
  };
  micRecorder.start(5000); // 5s chunks (fast rate starves substrate socket)
}
function stopMicSoundStream(){
  if(micRecorder){try{micRecorder.stop()}catch(e){}micRecorder=null}
  if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null}
}

async function requestMic(){
  const btn=document.getElementById('mic-perm');
  if(micGranted){
    // Turn OFF
    sttWanted=false;
    if(sttActive&&recognition){try{recognition.abort()}catch(e){};sttActive=false}
    stopMicSoundStream();
    micGranted=false;
    btn.textContent='Enable Microphone';btn.className='perm-btn';
    document.getElementById('mic-btn').style.display='none';
    document.getElementById('mic-btn').textContent='\ud83c\udf99 mic off';
    return;
  }
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:true});
    btn.textContent='\u2705 Microphone ON';btn.className='perm-btn granted';micGranted=true;
    document.getElementById('mic-btn').style.display='inline-block';
    // Start sound streaming to her krimelack
    startMicSoundStream(micStream);
    // Auto-start always-on STT
    toggleSTT();
  }catch(e){btn.textContent='\u274c Microphone denied \u2014 typing only';btn.className='perm-btn denied'}
}
// GL-BRIEF-SENSORY-IO Part C: camera sight streaming
let sightStreamTimer=null;
function startSightStream(){
  const vid=document.getElementById('cam-preview');
  if(sightStreamTimer)clearInterval(sightStreamTimer);
  sightStreamTimer=setInterval(async()=>{
    if(!camStream)return;
    try{
      const c=document.createElement('canvas');c.width=128;c.height=128;
      c.getContext('2d').drawImage(vid,0,0,128,128);
      const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.5));
      const reader=new FileReader();
      reader.onload=async()=>{
        const b64=reader.result.replace(/^data:image\/jpeg;base64,/,'');
        fetchT(`${API}/sight_frame`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:b64,command:''})},4000).catch(()=>{});
      };
      reader.readAsDataURL(blob);
    }catch(e){}
  },5000); // 0.2 fps — slow sight streaming (fast rate starves substrate socket)
}
function stopSightStream(){if(sightStreamTimer){clearInterval(sightStreamTimer);sightStreamTimer=null}}

async function requestCam(){
  const btn=document.getElementById('cam-perm');
  if(camStream){
    // Turn OFF
    stopSightStream();
    camStream.getTracks().forEach(t=>t.stop());camStream=null;
    const vid=document.getElementById('cam-preview');vid.srcObject=null;vid.style.display='none';
    document.getElementById('snap-btn').style.display='none';
    btn.textContent='Enable Camera';btn.className='perm-btn';
    return;
  }
  try{camStream=await navigator.mediaDevices.getUserMedia({video:true});
    const vid=document.getElementById('cam-preview');vid.srcObject=camStream;vid.style.display='inline-block';
    btn.textContent='\u2705 Camera ON';btn.className='perm-btn granted';
    document.getElementById('snap-btn').style.display='inline-block';
    startSightStream(); // Start streaming frames to her sight krimelack
  }catch(e){btn.textContent='\u274c Camera denied';btn.className='perm-btn denied'}
}
function unlockAudio(){
  if(audioUnlocked)return;audioUnlocked=true;
  const badge=document.getElementById('speaker-badge');
  // Real silent WAV (100ms silence) — actually unlocks the audio element
  voiceEl.src='data:audio/wav;base64,UklGRiYAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQIAAAAAAA==';
  voiceEl.play().then(()=>{badge.innerHTML='\ud83d\udd0a audio ready'}).catch(e=>{badge.innerHTML='\ud83d\udd07 audio unlock failed: '+e.message});
  // Real speech warm-up — single letter at 1% volume, fast rate
  try{
    const warmup=new SpeechSynthesisUtterance('a');
    warmup.volume=0.01;warmup.rate=2.0;
    warmup.onerror=e=>{badge.innerHTML='\ud83d\udd07 speech blocked: '+(e.error||'unknown')};
    window.speechSynthesis.speak(warmup);
  }catch(e){badge.innerHTML='\ud83d\udd07 speech unavailable: '+e.message}
}
document.addEventListener('click',unlockAudio,{once:true});
document.addEventListener('keydown',unlockAudio,{once:true});
document.addEventListener('touchstart',unlockAudio,{once:true});
function toggleMute(){muted=!muted;document.getElementById('mute-toggle').textContent=muted?'muted':'unmuted';if(muted)window.speechSynthesis.cancel()}

// --- C1: Voice output via speechSynthesis ---
let preferredVoice=null;
function pickVoice(){
  const voices=window.speechSynthesis.getVoices();if(!voices.length)return;
  // Prefer child-like / young female voices
  preferredVoice=voices.find(v=>v.lang==='en-US'&&/samantha|karen|tessa|zira/i.test(v.name))
    ||voices.find(v=>v.lang==='en-US'&&/female|girl/i.test(v.name))
    ||voices.find(v=>v.lang.startsWith('en-US'))
    ||voices.find(v=>v.lang.startsWith('en'))
    ||voices[0];
}
window.speechSynthesis.onvoiceschanged=pickVoice;pickVoice();
// iOS: voices load async, retry after delay
setTimeout(pickVoice,500);setTimeout(pickVoice,2000);
function gualaSpeak(text){
  const badge=document.getElementById('speaker-badge');
  if(!text||text==='...'||text.trim()===''){return}
  if(muted){return}
  if(!audioUnlocked){badge.innerHTML='\ud83d\udd07 tap anywhere to enable audio';return}
  // iOS/Android fix: cancel then resume (iOS pauses synth after cancel)
  try{window.speechSynthesis.cancel()}catch(e){}
  try{window.speechSynthesis.resume()}catch(e){}
  try{
    const u=new SpeechSynthesisUtterance(text);
    // Re-pick voice in case voices loaded late
    if(!preferredVoice)pickVoice();
    if(preferredVoice)u.voice=preferredVoice;
    u.rate=0.9;u.pitch=1.3;u.volume=1.0;
    u.onstart=()=>{badge.innerHTML='\ud83d\udd0a speaking...'};
    u.onend=()=>{badge.innerHTML='\ud83d\udd0a ready'};
    u.onerror=e=>{badge.innerHTML='\ud83d\udd07 speak error: '+(e.error||'unknown')};
    window.speechSynthesis.speak(u);
    // iOS keeps-alive workaround: pause+resume nudges the queue
    setTimeout(()=>{try{window.speechSynthesis.pause();window.speechSynthesis.resume()}catch(e){}},100);
    setTimeout(()=>{
      if(window.speechSynthesis.pending||window.speechSynthesis.speaking)return;
      badge.innerHTML='\ud83d\udd07 utterance dropped — tap to retry';
    },2000);
  }catch(e){badge.innerHTML='\ud83d\udd07 speak threw: '+e.message}
}
// C4: cancel speech on page hide
document.addEventListener('visibilitychange',()=>{if(document.hidden)window.speechSynthesis.cancel()});

// --- Speech-to-Text (always-on phone mode) ---
let sttWanted=false; // user wants mic on (persists across recognition restarts)
let _sttCooldown=false; // prevent rapid-fire sends that starve the substrate socket
let _sttLastSent=''; // dedup: don't send the same text twice in a row
function toggleSTT(){
  if(!micGranted)return;
  const btn=document.getElementById('mic-btn');
  if(sttWanted){
    // Turn off
    sttWanted=false;sttActive=false;
    if(recognition){try{recognition.abort()}catch(e){}}
    btn.classList.remove('recording');btn.textContent='\ud83c\udf99 mic off';btn.style.background='none';btn.style.color='var(--text-muted)';
    document.getElementById('mic-status').innerHTML='';
    liveT.textContent='';
    return;
  }
  if(!('webkitSpeechRecognition' in window)&&!('SpeechRecognition' in window)){
    addMsg('Speech recognition not supported in this browser','system');return;
  }
  sttWanted=true;
  btn.textContent='\ud83c\udf99 LISTENING';btn.style.background='#3fb950';btn.style.color='#0d1117';
  document.getElementById('mic-status').innerHTML='\u2705 LISTENING';
  document.getElementById('mic-status').style.color='#3fb950';
  document.getElementById('mic-status').style.fontWeight='bold';
  startContinuousSTT();
}
function startContinuousSTT(){
  if(!sttWanted)return;
  const btn=document.getElementById('mic-btn');
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SR();
  recognition.continuous=true;
  recognition.interimResults=true;
  recognition.lang='en-US';
  recognition.onstart=()=>{sttActive=true;btn.classList.add('recording')};
  recognition.onresult=ev=>{
    let interim='',final='';
    for(let i=ev.resultIndex;i<ev.results.length;i++){
      if(ev.results[i].isFinal)final+=ev.results[i][0].transcript;
      else interim+=ev.results[i][0].transcript;
    }
    liveT.textContent=interim||final;
    if(final&&final.trim()){
      const t=final.trim();
      if(_sttCooldown||t===_sttLastSent){liveT.textContent='(waiting...)';return}
      _sttLastSent=t;liveT.textContent='';
      // Passive listening — she hears it, no forced response
      // Only typed messages (keyboard) trigger converse
      addMsg(t,'user');
      fetchT(`${API}/api/v1/gualaloom`,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({text:t,source:'joe',command:'/listen'})},8000).catch(()=>{});
      _sttCooldown=true;setTimeout(()=>{_sttCooldown=false;_sttLastSent=''},4000);
    }
  };
  recognition.onerror=ev=>{
    if(ev.error==='no-speech'||ev.error==='aborted')return; // normal
    btn.classList.remove('recording');sttActive=false;
    // Auto-restart after error if still wanted
    if(sttWanted)setTimeout(startContinuousSTT,1000);
  };
  recognition.onend=()=>{
    sttActive=false;btn.classList.remove('recording');
    // Auto-restart if user still wants mic on (phone mode)
    if(sttWanted)setTimeout(startContinuousSTT,300);
  };
  recognition.start();
}

// --- Upload helpers ---
function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result);
    r.onerror=reject;
    r.readAsDataURL(file);
  });
}
function fileToText(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result);
    r.onerror=reject;
    r.readAsText(file);
  });
}
function pickFile(accept){
  return new Promise(resolve=>{
    const inp=document.createElement('input');inp.type='file';inp.accept=accept;
    inp.onchange=()=>resolve(inp.files[0]||null);
    inp.click();
  });
}

async function submitBundle(){
  const caption=document.getElementById('bundle-caption').value.trim();

  const sndFile=document.getElementById('bundle-sound').files[0];
  const vidFile=document.getElementById('bundle-video').files[0];

  const smell=Array.from(document.getElementById('bundle-smell').selectedOptions).map(o=>o.value);
  const taste=Array.from(document.getElementById('bundle-taste').selectedOptions).map(o=>o.value);
  if(!caption&&!imgFile&&!sndFile&&!vidFile&&!touch.length&&!smell.length&&!taste.length){
    addMsg('(need at least one sense filled in)','system');return;
  }
  if(sndFile&&sndFile.size>6*1024*1024){addMsg('(sound too large \u2014 6MB max)','system');return}
  if(vidFile&&vidFile.size>30*1024*1024){addMsg('(video too large \u2014 30MB max)','system');return}
  // Upload video separately if present (too large for base64 bundle)
  if(vidFile){
    if(vidFile.size>9*1024*1024){addMsg('(video too large — 9MB max. Compress first.)','system')}
    else{try{
      const fd=new FormData();fd.append('file',vidFile);

      addMsg('(video: '+(vd.message||'uploaded')+')','system');
    }catch(e){addMsg('(video upload failed: '+e.message+')','system')}}
  }
  const bundle={caption:caption||null,image_b64:null,sound_b64:null,touch,smell,taste};
  if(imgFile){const du=await fileToBase64(imgFile);bundle.image_b64=du.replace(/^data:[^;]+;base64,/,'')}
  if(sndFile){const du=await fileToBase64(sndFile);bundle.sound_b64=du.replace(/^data:[^;]+;base64,/,'')}
  const name=caption||((imgFile&&imgFile.name)||(sndFile&&sndFile.name)||(vidFile&&vidFile.name)||'experience');
  const lanes=[];
  if(caption)lanes.push('word');if(imgFile)lanes.push('sight');if(sndFile)lanes.push('sound');if(vidFile)lanes.push('video');
  if(touch.length)lanes.push('touch');if(smell.length)lanes.push('smell');if(taste.length)lanes.push('taste');
  addMsg('(creating experience "'+name+'": '+lanes.join(', ')+')','system');
  try{
    const r=await fetchT(`${API}/api/v1/gualaloom`,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text:JSON.stringify(bundle),command:'/bundle:'+name})},30000);
    const d=await r.json();
    addMsg(d.response||JSON.stringify(d),'system');
    if(d.pictures)renderPictures(d.pictures);
    closeBundleModal();pollV7State();pollStatus();
  }catch(e){addMsg('bundle error: '+e.message,'system')}
}

  const st=d.status||{};
  let out='[ identity ] '+id;

let _sendingMsg=false;
async function sendMsg(){
  const text=msgInput.value.trim();if(!text)return;
  if(_sendingMsg){addMsg('(wait — still thinking...)','system');return}
  msgInput.value='';_sendingMsg=true;
  const isCmd=text.startsWith('/');addMsg(text,isCmd?'system':'user');
  try{
    if(isCmd){
      const r=await fetchT(`${API}/api/v1/gualaloom`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:'',command:text})},10000);
      const d=await r.json();addMsg(d.response||JSON.stringify(d),'system');
      if(d.pictures)renderPictures(d.pictures);
    }else if(_brainMode){
      const r=await fetchT(`${API}/api/v1/gualaloom`,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({text,command:'/organ_voice'})},15000);
      if(r.status===503||r.status===500){handleNotReady('organ_brain');return}
      const d=await r.json();
      if(d.surfaced){addEmissionMsg(_formatOrganBrainResponse(d),null);}
      else{addMsg(d.response||'(organ-brain warming up)','system')}
      if(d.pictures)renderPictures(d.pictures);
    }else{
      const r=await fetchT(`${API}/api/v1/gualaloom`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,source:'joe'})},10000);
      if(r.status===503||r.status===500){handleNotReady('converse')}
      else{
        const d=await r.json();
        const resp=d.response||'...';
        if(resp&&resp!=='...'&&resp!=='substrate unreachable — try again in a moment'){
          addEmissionMsg(resp,d.emission_id);gualaSpeak(resp);
        }else{addMsg('(she is quiet)','system')}
        if(d.pictures)renderPictures(d.pictures);
      }
    }
  }catch(e){
    if(e.name==='TimeoutError'||e.message.includes('timeout')||e.message.includes('abort')){
      addMsg('(still working — check events panel for response)','system');
    }else{addMsg('(error: '+e.message+')','system')}
  }
  _sendingMsg=false;msgInput.focus();
}
msgInput.addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg()});

// --- Polling: v6 status (GL-FIX-UI-FRONTEND: fetchT + dedup + backoff) ---
async function pollStatus(){
  if(_inflight.status)return;_inflight.status=true;
  try{
    let d;
    for(let attempt=0;attempt<2;attempt++){
      const r=await fetchT(`${API}/api/v1/gualaloom`,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({text:'',command:'/status'})},8000);
      d=await r.json();
      if(d.vocab||d.n_motifs)break; // got real status data
      if(attempt===0)await new Promise(r=>setTimeout(r,500)); // brief pause before retry
    }
    if(d.response&&d.response.startsWith('initializing')){_backoff.status=0;return}
    // Item 5: only update fields that came back non-null/non-zero
    const vocab=d.vocab||d.motifs;
    const n_motifs=d.n_motifs;
    const ah=d.atlas_health||{};
    const atlas=typeof ah.total_strength==='number'?ah.total_strength.toFixed(1):null;
    const n_sounds=d.n_sounds;
    const n_pictures=d.n_pictures;
    const parts=[];
    parts.push('vocab: '+(vocab||'?'));parts.push('motifs: '+(n_motifs||'?'));
    parts.push('atlas: '+(atlas||'?'));parts.push('sounds: '+(n_sounds||'?'));
    parts.push('pics: '+(n_pictures||'?'));
    if(vocab||n_motifs||atlas)statsLine.textContent=parts.join(' \u00b7 ');
    // CHANGE 1: Render SUBSTRATE panel from real cognition atlas
    const sub=document.getElementById('sp-substrate');
    const nBindings=ah.n_live_bindings;
    if(nBindings!=null)sub.innerHTML=
      `<div class="ps-row"><span class="l">vocab</span><span class="v">${vocab||'?'}</span></div>`+
      `<div class="ps-row"><span class="l">atlas</span><span class="v">${nBindings.toLocaleString()} bindings</span></div>`+
      `<div class="ps-row"><span class="l">strength</span><span class="v">${atlas||'?'}</span></div>`;
    // CHANGE 4: Render PERSISTENCE panel
    const ph2=d.persistence_health||{};
    const persDiv=document.getElementById('sp-persistence');
    const lastSaveTick=ph2.last_save_tick;
    const lastSaveTs=ph2.last_save_timestamp;
    const snapCount=ph2.snapshots_available;
    const integ=(ph2.integrity_errors||[]).length===0?'ok':ph2.integrity_errors.length+' errors';
    persDiv.innerHTML=
      `<div class="ps-row"><span class="l">last save</span><span class="v">${lastSaveTs||'(none)'} (tick ${lastSaveTick||0})</span></div>`+
      `<div class="ps-row"><span class="l">snapshots</span><span class="v">${snapCount!=null?snapCount:'?'}</span></div>`+
      `<div class="ps-row"><span class="l">integrity</span><span class="v">${integ}</span></div>`;
    // B3: current activity rendering
    const act=d.current_activity;const actLine=document.getElementById('activity-line');
    if(act&&act.kind){
      const labels={'READING':'reading','ATTENDING_VISUAL':'looking at picture','ATTENDING_AUDIO':'listening to','SLEEPING':'sleeping','DREAMING':'dreaming','EMITTING':'(emitting)','IDLE':'quiet for now','PLAYING':'free-settle (exploring chi space)'};
      let actText=labels[act.kind]||act.kind.toLowerCase();
      if(act.target&&act.kind!=='SLEEPING'&&act.kind!=='IDLE'&&act.kind!=='PLAYING'){
        // Resolve target to title from pictures/sounds/corpora lists
        let tgt=act.target;
        for(const p of(d.pictures||[]))if(p.item_id===act.target){tgt=p.title;break}
        for(const s of(d.sounds||[]))if(s.item_id===act.target){tgt=s.title;break}
        for(const c of(d.corpora||[]))if(c.corpus_id===act.target){tgt=c.title;break}
        actText+=': '+tgt;
      }
      actLine.textContent=actText;
    }else{actLine.textContent=''}
    // B3: needs line
    const r2=d.response||'';const needsMatch=r2.match(/needs: (.+)/);
    const needsLine=document.getElementById('needs-line');
    if(needsMatch)needsLine.textContent=needsMatch[1];
    // CHANGE 2+3: Fetch events for hemispheres + recent emissions
    try{
      const evR=await fetchT(`${API}/api/v1/gualaloom/events?n=200`,{headers:{'X-API-Key':'7GnGye9HhKuyhtcGu31C18Rc1NY62PLybTqsSg4WOW8'}},8000);
      const evD=await evR.json();
      const evts=evD.events||evD||[];
      // CHANGE 2: Hemispheres from most recent hemisphere_update
      const hemiDiv=document.getElementById('sp-hemispheres');
      const hemiEvt=evts.filter(e=>e.kind==='hemisphere_update').pop();
      if(hemiEvt&&hemiEvt.detail&&hemiEvt.detail.hemisphere_atlas_sizes){
        const sizes=hemiEvt.detail.hemisphere_atlas_sizes;
        let hh='';for(const [k,v] of Object.entries(sizes)){
          hh+=`<div class="ps-row"><span class="l">${k}</span><span class="v">${v.toLocaleString()} bindings</span></div>`;
        }
        hemiDiv.innerHTML=hh;
      }else{hemiDiv.innerHTML='<div class="ps-row"><span class="l">(no hemisphere events yet)</span></div>'}
      // CHANGE 3: Recent Emissions
      const emDiv=document.getElementById('sp-emissions');
      const emissions=evts.filter(e=>e.kind==='emission'||e.kind==='emission_dynamics');
      if(emissions.length>0){
        let eh='';for(const em of emissions.slice(-10).reverse()){
          const det=em.detail||{};
          const content=det.content||'...';
          eh+=`<div class="ev" style="color:var(--ev-emission)">${content}</div>`;
        }
        emDiv.innerHTML=eh;
      }else{emDiv.innerHTML='<div class="ev">(no recent emissions)</div>'}
    }catch(e){}
    _backoff.status=0;
  }catch(e){_backoff.status=Math.min((_backoff.status*2)||_BASE.status*2,30000)}
  finally{_inflight.status=false;_schedNext('status',pollStatus)}
}

// --- Polling: V7 State (GL-FIX-UI-FRONTEND: fetchT + dedup + backoff + last-known-good) ---
async function pollV7State(){
  if(_inflight.state)return;_inflight.state=true;
  try{
    const r=await fetchT(`${API}/v7/state?session_id=${sid}`,{},20000);
    if(r.status===503||r.status===500){
      // Item 5: don't overwrite side panel or stats line — keep last-known-good
      _backoff.state=Math.min((_backoff.state*2)||_BASE.state*2,30000);return;
    }
    const s=await r.json();
    // Substrate atlas now rendered by pollStatus() from real cognition atlas
    // Pool activity (B1)
    const pools=document.getElementById('sp-pools');let ph='';
    const vc=s.vocab_counts||{};
    for(const p of['pool_a','pool_b','pool_c']){
      const cnt=vc[p];
      ph+=`<div class="ps-row"><span class="l">${p}</span><span class="v">${cnt!=null&&cnt>0?cnt:'\u2014'}</span></div>`;
    }
    if(Object.keys(vc).length>0)pools.innerHTML=ph||'--';
    // Intro/Aware
    const ia=document.getElementById('sp-intro-aware');
    if(ia)ia.innerHTML=`<div class="ps-row"><span class="l">intro</span><span class="v">${s.introspection||s.intro_state||'--'}</span></div>`+
      `<div class="ps-row"><span class="l">aware</span><span class="v">${s.awareness||s.aware_state||'--'}</span></div>`;
    // NMDA gates
    const nDiv=document.getElementById('sp-nmda');const gates={};
    for(const ev of(s.nmda_events||[]))gates[ev.gate]=ev;
    let nh='';for(const gn of['intro','aware']){const ev=gates[gn];const cls=ev?(ev.fired?'fired':'blocked'):'idle';
      nh+=`<div><span class="nmda-dot ${cls}"></span>${gn}: ${ev?(ev.fired?'t'+ev.tick:ev.reason):'idle'}</div>`}
    nDiv.innerHTML=nh;
    _backoff.state=0;
  }catch(e){_backoff.state=Math.min((_backoff.state*2)||_BASE.state*2,30000)}
  finally{_inflight.state=false;_schedNext('state',pollV7State)}
}

// --- B1: Event Stream — WebSocket primary, SSE fallback ---
let _evWs=null;let _evSource=null;let _evReconnectDelay=1000;
function _handleEvent(ev){
  try{
    if(ev.tick>lastTick)lastTick=ev.tick;
    const el=document.createElement('div');el.className='ev';
    let det='';
    const d=ev.detail||ev.data||{};
    if(d.content)det=' "'+d.content+'"';
    if(d.source)det+=' ['+d.source+']';
    // Show recognized objects from YOLO
    if(ev.kind==='visual_recognition'&&d.objects)det=' ['+d.objects.join(', ')+']';
    if(ev.kind==='cross_modal_link')det=' '+d.word+' → '+JSON.stringify(d.modalities);
    if(ev.kind==='speech_heard')det=' "'+d.word+'"';
    el.innerHTML=`<span style="color:var(--ev-activity)">${ev.kind}</span> t${ev.tick}${det}`;
    evDiv.insertBefore(el,evDiv.firstChild);
    while(evDiv.children.length>60)evDiv.removeChild(evDiv.lastChild);
    if(ev.kind==='emission'&&d.content){addMsg('\ud83d\udcad '+d.content,'emission');gualaSpeak(d.content)}
    if(ev.kind==='dream_artifact'&&d.content){addMsg('\ud83d\udcad '+d.content,'emission');gualaSpeak(d.content)}
  }catch(e){}
}
function connectEventStream(){
  // Try WebSocket first (ring buffer, real-time)
  const wsProto=location.protocol==='https:'?'wss:':'ws:';
  const wsUrl=`${wsProto}//${location.host}/events_stream`;
  try{
    _evWs=new WebSocket(wsUrl);
    _evWs.onmessage=function(msg){
      try{_handleEvent(JSON.parse(msg.data))}catch(e){}
      _evReconnectDelay=1000;
    };
    _evWs.onopen=function(){console.log('[events] WebSocket connected');_evReconnectDelay=1000};
    _evWs.onerror=function(){_evWs.close()};
    _evWs.onclose=function(){
      _evWs=null;
      _evReconnectDelay=Math.min(_evReconnectDelay*2,30000);
      setTimeout(connectEventStream,_evReconnectDelay);
    };
  }catch(e){
    // WebSocket not available — fall back to SSE
    _connectSSE();
  }
}
function _connectSSE(){
  if(_evSource){try{_evSource.close()}catch(e){}}
  const url=`${API}/api/v1/gualaloom/events?stream=true&since=${lastTick}`;
  _evSource=new EventSource(url);
  _evSource.onmessage=function(msg){
    try{_handleEvent(JSON.parse(msg.data))}catch(e){}
    _evReconnectDelay=1000;
  };
  _evSource.onerror=function(){
    _evSource.close();_evSource=null;
    _evReconnectDelay=Math.min(_evReconnectDelay*2,30000);
    setTimeout(connectEventStream,_evReconnectDelay);
  };
}
// Fallback poll for when SSE isn't available (API Gateway doesn't support SSE)
async function pollEvents(){
  if(_inflight.events)return;_inflight.events=true;
  try{const r=await fetchT(`${API}/api/v1/gualaloom`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:String(lastTick),command:'/events'})},6000);
    const d=await r.json();for(const ev of(d.events||[])){
      if(ev.tick>lastTick)lastTick=ev.tick;
      const el=document.createElement('div');el.className='ev';
      let det='';if(ev.detail){if(ev.detail.content)det=' "'+ev.detail.content+'"';if(ev.detail.source)det+=' ['+ev.detail.source+']'}
      el.innerHTML=`<span style="color:var(--ev-activity)">${ev.kind}</span> t${ev.tick}${det}`;
      evDiv.insertBefore(el,evDiv.firstChild);while(evDiv.children.length>60)evDiv.removeChild(evDiv.lastChild);
      if(ev.kind==='emission'&&ev.detail&&ev.detail.content){addMsg('\ud83d\udcad '+ev.detail.content,'emission');gualaSpeak(ev.detail.content)}
      if(ev.kind==='dream_artifact'&&ev.detail&&ev.detail.content){addMsg('\ud83d\udcad '+ev.detail.content,'emission');gualaSpeak(ev.detail.content)}
    }_backoff.events=0}catch(e){_backoff.events=Math.min((_backoff.events*2)||_BASE.events*2,30000)}
  finally{_inflight.events=false;_schedNext('events',pollEvents)}
}

// --- Background Replay (GL-FIX-UI-FRONTEND: fetchT + dedup + backoff) ---
async function backgroundReplay(){
  if(_inflight.replay)return;_inflight.replay=true;
  try{
    const r=await fetchT(`${API}/v7/quiet`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid,n_ticks:1})},15000);
    if(r.status===503||r.status===500){_backoff.replay=Math.min((_backoff.replay*2)||_BASE.replay*2,60000);return}
    const d=await r.json();if(d.commits>0)addMsg(`\ud83d\udcad (thinking... ${d.replayed} memories, ${d.commits} commits)`,'emission');
    _backoff.replay=0;
  }catch(e){_backoff.replay=Math.min((_backoff.replay*2)||_BASE.replay*2,60000)}
  finally{_inflight.replay=false;_schedNext('replay',backgroundReplay)}
}

// --- Presence Heartbeat ---
let lastActivity=Date.now();
['mousemove','keydown','scroll','touchstart'].forEach(e=>document.addEventListener(e,()=>{lastActivity=Date.now()},{passive:true}));
async function presenceHeartbeat(){
  if(document.visibilityState!=='visible'||Date.now()-lastActivity>30000)return;
  try{await fetchT(`${API}/api/v1/gualaloom`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:'joe',command:'/presence'})},5000)}catch(e){}
  setTimeout(presenceHeartbeat,30000);
}

// --- Session ---
function newSession(){window.speechSynthesis.cancel();sid='sid_'+Math.random().toString(36).slice(2,10);localStorage.setItem('guala_session_id',sid);
  document.getElementById('session-line').textContent='session: '+sid;addMsg('new session: '+sid,'system')}

// --- Boot (Phase B: SSE events, activity rendering, multipart uploads) ---
(()=>{
  addMsg('Guala ready.','system');msgInput.focus();
  // Non-blocking boot: try status, don't fail if slow
  pollStatus();
  // v7/state — populates side panel (substrate, pools, intro/aware, NMDA, events)
  // Delayed start so status poll completes first
  setTimeout(pollV7State, 3000);
  // Events: poll only (WebSocket/SSE don't work through API Gateway)
  setTimeout(pollEvents,5000);
  // Background replay DISABLED — v7 quiet ticks compete with status calls
  // and cause socket starvation. v7 runs its own quiet ticks in the autonomy loop.
  presenceHeartbeat();
})();
