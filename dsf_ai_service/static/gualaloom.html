<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>GualaLoom</title>
<style>
:root {
  --bg: #0d1117;
  --bg-alt: #161b22;
  --text: #e6edf3;
  --text-muted: #7d8590;
  --accent: #58a6ff;
  --border: #30363d;
  --input-bg: #0d1117;
  --msg-user: #1f2937;
  --msg-sub: #161b22;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-alt);
}
header h1 {
  font-size: 16px;
  font-weight: 500;
  color: var(--accent);
  letter-spacing: 0.5px;
}
header p {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 4px;
}
#status {
  font-size: 11px;
  color: var(--text-muted);
  padding: 6px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-alt);
}
#chat {
  flex: 1;
  overflow-y: auto;
  padding: 16px 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.msg {
  max-width: 80%;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 14px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
}
.msg.user {
  align-self: flex-end;
  background: var(--msg-user);
  border: 1px solid var(--border);
  color: var(--text);
}
.msg.substrate {
  align-self: flex-start;
  background: var(--msg-sub);
  border: 1px solid var(--border);
  color: var(--accent);
}
.msg.system {
  align-self: center;
  color: var(--text-muted);
  font-size: 12px;
  font-style: italic;
}
#input-area {
  padding: 12px 24px;
  border-top: 1px solid var(--border);
  background: var(--bg-alt);
  display: flex;
  gap: 8px;
}
#input-area input {
  flex: 1;
  background: var(--input-bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 14px;
  border-radius: 6px;
  font-family: inherit;
  font-size: 14px;
  outline: none;
}
#input-area input:focus {
  border-color: var(--accent);
}
#input-area button {
  background: var(--accent);
  color: #0d1117;
  border: none;
  padding: 10px 20px;
  border-radius: 6px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
#input-area button:hover { opacity: 0.9; }
#input-area button:disabled { opacity: 0.4; cursor: default; }
.commands {
  padding: 8px 24px;
  font-size: 11px;
  color: var(--text-muted);
  border-top: 1px solid var(--border);
  background: var(--bg);
}
</style>
</head>
<body>

<header>
  <h1>GualaLoom</h1>
  <p>substrate that grows from what you say. early. mostly silent.</p>
</header>
<div id="status">loading...</div>
<div id="chat"></div>
<div id="input-area">
  <input id="msg" type="text" placeholder="type here" autocomplete="off">
  <button id="send" onclick="sendMsg()">send</button>
</div>
<div class="commands">say something. she starts with 7 words and learns the rest from you.</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('msg');
const btn = document.getElementById('send');
const status = document.getElementById('status');

function addMsg(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

async function sendMsg() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  btn.disabled = true;

  const isCmd = text.startsWith('/');
  if (!isCmd) addMsg(text, 'user');
  else addMsg(text, 'system');

  try {
    const body = isCmd
      ? { text: '', command: text }
      : { text: text };

    const API = 'https://3d6toi0gw0.execute-api.us-east-1.amazonaws.com';
    const res = await fetch(`${API}/api/v1/gualaloom`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (isCmd) {
      addMsg(data.response, 'system');
    } else {
      addMsg(data.response, 'substrate');
    }
    status.textContent = `vocab: ${data.motifs} words`;
  } catch (e) {
    addMsg('(connection error)', 'system');
  }
  btn.disabled = false;
  input.focus();
}

input.addEventListener('keydown', e => {
  if (e.key === 'Enter') sendMsg();
});

// Initial status check
(async () => {
  try {
    const API = 'https://3d6toi0gw0.execute-api.us-east-1.amazonaws.com';
    const res = await fetch(`${API}/api/v1/gualaloom`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: '', command: '/status' }),
    });
    const data = await res.json();
    status.textContent = `vocab: ${data.motifs} words`;
    addMsg('awake. say something.', 'system');
  } catch (e) {
    status.textContent = 'connecting...';
    addMsg('substrate is waking up. try again in a moment.', 'system');
  }
  input.focus();
})();
</script>
</body>
</html>
