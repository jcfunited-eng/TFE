<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSF-AI — Hardware Weight Derivation</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="/static/style.css">
  <script>
    const CLERK_PK = 'pk_live_Y2xlcmsuZHNmLWFpLmNvbSQ';
    (async () => {
      const { Clerk } = await import('https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/+esm');
      const clerk = new Clerk(CLERK_PK);
      await clerk.load();
      window.Clerk = clerk;
      window.dispatchEvent(new Event('clerk-loaded'));
    })();
  </script>
  <style>
    .hw-page { max-width: 900px; margin: 2rem auto; padding: 0 1.5rem; }
    .hw-page h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .hw-page p { color: #666; margin-bottom: 1rem; }
    .hw-gate { text-align: center; padding: 3rem; }
    .hw-gate h2 { margin-bottom: 1rem; }
    .hw-form { margin: 1.5rem 0; }
    .hw-form label { display: block; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; color: #666; margin-bottom: 0.3rem; margin-top: 1rem; }
    .hw-form input, .hw-form select, .hw-form textarea { width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 6px; font-size: 0.9rem; font-family: monospace; }
    .hw-form textarea { height: 180px; resize: vertical; }
    .sensor-config { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.75rem; margin: 1rem 0; }
    .sensor-item { background: #f8f8f8; border: 1px solid #ddd; border-radius: 6px; padding: 0.75rem; }
    .sensor-item label { margin-top: 0; }
    .mode-tabs { display: flex; gap: 0; margin: 1.5rem 0 0.5rem; }
    .mode-tab { padding: 0.6rem 1.5rem; border: 1px solid #ddd; background: #f0f0f0; cursor: pointer; font-size: 0.9rem; font-weight: 600; }
    .mode-tab:first-child { border-radius: 6px 0 0 6px; }
    .mode-tab:last-child { border-radius: 0 6px 6px 0; }
    .mode-tab.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    .mode-panel { display: none; }
    .mode-panel.active { display: block; }
    .bg-fields { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.75rem; margin: 0.5rem 0; }
    .bg-field { background: #f8f8f8; border: 1px solid #ddd; border-radius: 6px; padding: 0.75rem; }
    .bg-field label { margin-top: 0; font-size: 0.75rem; }
    .bg-field input { font-size: 0.9rem; }
    .output-section { margin-top: 2rem; }
    .output-block { background: #1a1a1a; color: #4ade80; border-radius: 8px; padding: 1rem; font-family: monospace; font-size: 0.8rem; white-space: pre-wrap; overflow-x: auto; margin: 0.5rem 0; max-height: 400px; overflow-y: auto; }
    .output-label { font-size: 0.85rem; font-weight: 600; color: #666; margin-top: 1rem; margin-bottom: 0.25rem; }
    .copy-btn { padding: 0.3rem 0.8rem; background: #333; color: #eee; border: 1px solid #555; border-radius: 4px; cursor: pointer; font-size: 0.8rem; margin-left: 0.5rem; }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="/" style="text-decoration:none;"><h1 class="logo">DSF<span class="logo-ai">-AI</span></h1></a>
    <nav><span id="user-button"></span></nav>
  </div>
</header>

<div class="hw-page">

    <button class="btn btn-primary" id="hw-signin">Sign In</button>

  <div id="hw-content" hidden>
    <h1>Hardware Weight Derivation</h1>
    <p>Derive coupling weights + BSIL thresholds from sensor calibration data. Outputs Verilog parameters and JSON.</p>

      <div class="mode-tab" data-mode="camera">Camera Vision</div>
    </div>

    <!-- IR DISTANCE MODE -->

        <input type="text" id="ir-label" value="Sharp GP2Y0A41SK0F (3x, front/left/right)">

        <label>Sensor Names</label>

        <label>Sensor Roles</label>

            <select data-ir-role="right"><option value="axial">Axial (speed)</option><option value="lateral" selected>Lateral (steer)</option></select>
          </div>
        </div>

        <button class="btn btn-primary" id="ir-derive" style="margin-top:1rem;">Derive IR Weights</button>
      </div>
    </div>

    <!-- ═══════════════════════════════════════════════ -->
    <!-- CAMERA VISION MODE -->
    <!-- ═══════════════════════════════════════════════ -->
    <div class="mode-panel" id="panel-camera">
      <div class="hw-form">
        <label>Object Label</label>
        <input type="text" id="cam-label" value="Turntable capture — object 1">

        <label>Background Baselines (empty light box readings)</label>

        <button class="btn btn-primary" id="cam-derive" style="margin-top:1rem;">Derive Camera Weights</button>
      </div>
    </div>

    <div id="hw-status" style="margin-top:0.5rem;color:#666;"></div>

    <!-- OUTPUT (shared) -->
    <div id="hw-output" class="output-section" hidden>
      <h2>Results</h2>
      <div class="output-label">Verilog Parameters <button class="copy-btn" onclick="copyOutput('verilog')">Copy</button></div>
      <div class="output-block" id="out-verilog"></div>
      <div class="output-label">JSON <button class="copy-btn" onclick="copyOutput('json')">Copy</button></div>
      <div class="output-block" id="out-json"></div>
      <div class="output-label">Profiles <button class="copy-btn" onclick="copyOutput('profiles')">Copy</button></div>
      <div class="output-block" id="out-profiles"></div>
      <div style="margin-top:1rem;">
        <button class="btn btn-small" onclick="downloadOutput('verilog', 'derived_weights.v')">Download Verilog</button>
        <button class="btn btn-small" onclick="downloadOutput('json', 'derived_weights.json')">Download JSON</button>
      </div>
    </div>
  </div>
</div>

<script>
const API = 'https://3d6toi0gw0.execute-api.us-east-1.amazonaws.com';

// Auth
async function initAuth() {
  if (!window.Clerk) {
    await new Promise(r => { window.addEventListener('clerk-loaded', r, { once: true }); setTimeout(r, 10000); });
  }
  const clerk = window.Clerk;
  if (clerk && clerk.user) {
    document.getElementById('hw-gate').hidden = true;
    document.getElementById('hw-content').hidden = false;
    const ub = document.getElementById('user-button');
    ub.innerHTML = `<span style="font-size:0.9rem;">${clerk.user.firstName || 'User'}</span>`;
  } else {
    document.getElementById('hw-signin').addEventListener('click', () => {
      if (clerk) clerk.openSignIn({ redirectUrl: window.location.href });
    });
  }
}
document.addEventListener('DOMContentLoaded', initAuth);

// Tab switching
document.querySelectorAll('.mode-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.mode-panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.mode).classList.add('active');
    document.getElementById('hw-output').hidden = true;
  });
});

// IR Derive
document.getElementById('ir-derive').addEventListener('click', async () => {
  const btn = document.getElementById('ir-derive');
  const status = document.getElementById('hw-status');
  btn.disabled = true;
  status.textContent = 'Running IR derivation...';
  status.style.color = '#666';

  const csvText = document.getElementById('ir-csv').value.trim();
  const label = document.getElementById('ir-label').value.trim();
  const names = document.getElementById('ir-names').value.split(',').map(s => s.trim());
  const roles = {};
  document.querySelectorAll('[data-ir-role]').forEach(sel => { roles[sel.dataset.irRole] = sel.value; });

  const lines = csvText.split('\n').filter(l => l.trim());
  const calTable = {};
  for (let i = 1; i < lines.length; i++) {
    const parts = lines[i].split(',').map(s => s.trim());
    const stim = parts[0].toLowerCase() === 'inf' ? 'inf' : parseFloat(parts[0]);
    const readings = parts.slice(1).map(v => v === '' ? null : parseFloat(v));
    calTable[stim] = readings;
  }

  try {
    const resp = await fetch(`${API}/api/v1/hw/derive`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ calibration_table: calTable, sensor_names: names, sensor_roles: roles, sensor_label: label }),
    });
    if (!resp.ok) throw new Error((await resp.json()).detail || 'Failed');
    const result = await resp.json();
    showOutput(result);
    status.textContent = `Done in ${result.compute_time_s || '?'}s`;
  } catch (e) {
    status.textContent = `Error: ${e.message}`;
    status.style.color = '#dc2626';
  }
  btn.disabled = false;
});

// Camera Derive
document.getElementById('cam-derive').addEventListener('click', async () => {
  const btn = document.getElementById('cam-derive');
  const status = document.getElementById('hw-status');
  btn.disabled = true;
  status.textContent = 'Running camera derivation...';
  status.style.color = '#666';

  const label = document.getElementById('cam-label').value.trim();
  const bgY = parseInt(document.getElementById('bg-y').value);
  const bgEdge = parseInt(document.getElementById('bg-edge').value);
  const bgU = parseInt(document.getElementById('bg-u').value);
  const csvText = document.getElementById('cam-csv').value.trim();

  // Parse camera CSV
  const lines = csvText.split('\n').filter(l => l.trim());
  const samples = [];
  for (let i = 1; i < lines.length; i++) {
    const parts = lines[i].split(',').map(s => s.trim());
    if (parts.length >= 5) {
      samples.push({
        sample: parseInt(parts[0]),
        orientation: parts[1],
        y_mean: parseInt(parts[2]),
        edge_count: parseInt(parts[3]),
        u_mean: parseInt(parts[4]),
      });
    }
  }

  // Convert to calibration table format the backend expects
  // Each sample becomes a row, the three features are the "sensors"
  const calTable = {};
  calTable['inf'] = [bgY, bgEdge, bgU];  // background = baseline
  samples.forEach(s => {
    calTable[s.sample] = [s.y_mean, s.edge_count, s.u_mean];
  });

  const names = ['y_mean', 'edge_count', 'u_mean'];
  const roles = { 'y_mean': 'structural', 'edge_count': 'structural', 'u_mean': 'structural' };

  try {
    const resp = await fetch(`${API}/api/v1/hw/derive`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        calibration_table: calTable,
        sensor_names: names,
        sensor_roles: roles,
        sensor_label: label + ' (camera: Y/Edge/U)',
        camera_mode: true,
        background: { y_mean: bgY, edge_count: bgEdge, u_mean: bgU },
      }),
    });
    if (!resp.ok) throw new Error((await resp.json()).detail || 'Failed');
    const result = await resp.json();
    showOutput(result);
    status.textContent = `Done in ${result.compute_time_s || '?'}s`;
  } catch (e) {
    status.textContent = `Error: ${e.message}`;
    status.style.color = '#dc2626';
  }
  btn.disabled = false;
});

function showOutput(result) {
  document.getElementById('out-verilog').textContent = result.verilog;
  try {
    document.getElementById('out-json').textContent = JSON.stringify(JSON.parse(result.json), null, 2);
  } catch (e) {
    document.getElementById('out-json').textContent = result.json;
  }
  document.getElementById('out-profiles').textContent = result.profiles;
  document.getElementById('hw-output').hidden = false;
}

function copyOutput(id) {
  navigator.clipboard.writeText(document.getElementById('out-' + id).textContent);
}

function downloadOutput(id, filename) {
  const blob = new Blob([document.getElementById('out-' + id).textContent], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
