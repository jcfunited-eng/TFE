version: 0.2

phases:
  pre_build:
    commands:
      - aws --version
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 418384447921.dkr.ecr.us-east-1.amazonaws.com
  build:
    commands:
      - docker build -f dsf_ai_service/Dockerfile.glew --build-arg GIT_SHA="${GIT_SHA:-unknown}" --build-arg BUILD_TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)" -t "$IMAGE_URI" .
  post_build:
    commands:
      - docker push "$IMAGE_URI"
