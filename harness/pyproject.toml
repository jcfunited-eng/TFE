[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guala-harness"
version = "0.1.0"
description = "GualaLoom substrate verification harness. Per GL-SPEC-TEST-HARNESS-EVE-20260706-v1."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "boto3>=1.34",
]

[project.scripts]
harness = "harness.cli:main"

[tool.setuptools]
packages = ["harness", "harness.observability"]
