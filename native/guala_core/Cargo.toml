[package]
name = "guala_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "guala_core"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python-extension = ["pyo3/extension-module"]
diagnostic-api = []

[dependencies]
pyo3 = "0.23"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
sha2 = "0.10"
hmac = "0.12"
httparse = "1.10"
zeroize = { version = "1.8", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
